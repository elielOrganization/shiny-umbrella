<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fichaje de Profesores · Shiny Umbrella</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Input invisible que captura lo que escribe el lector NFC (modo teclado/HID) -->
  <input id="nfc-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false">

  <div class="header">
    <h1>SHINY UMBRELLA</h1>
    <p>Fichaje de Profesores</p>
  </div>

  <div class="centro">

    <!-- Siempre visible. El servidor decide automáticamente si es entrada o salida -->
    <div class="nfc-card" id="nfc-card">
      <span class="nfc-icon">📡</span>
      <h2>Acerque su tarjeta NFC al lector</h2>
      <div class="estado" id="estado">Esperando tarjeta...</div>
    </div>

    <!-- Muestra el último fichaje registrado. Empieza invisible y aparece con animación -->
    <div class="result-card" id="result-card">
      <div class="result-texto" id="result-texto"></div>
      <div class="result-hora" id="result-hora"></div>
    </div>
  </div>

  <div class="footer">
    Shiny Umbrella &nbsp;·&nbsp; Sistema de Fichaje &nbsp;·&nbsp; v1.0
  </div>

  <!--
    Overlay de resultado: cubre la pantalla 4 segundos tras cada fichaje.
    Variantes de color según clase en overlay-box:
      overlay-entrada → verde | overlay-salida → azul | overlay-error → rojo
    Se cierra al tocar o automáticamente.
  -->
  <div class="overlay-bg" id="overlay" onclick="cerrarOverlay()">
    <div class="overlay-box" id="overlay-box">
      <div class="overlay-header">
        <span class="overlay-simbolo" id="overlay-simbolo"></span>
        <div class="overlay-titulo" id="overlay-titulo"></div>
      </div>
      <div class="overlay-body">
        <div class="overlay-label" id="overlay-label">Profesor/a</div>
        <div class="overlay-nombre" id="overlay-nombre"></div>
        <div class="overlay-hora-box">
          <div class="overlay-hora-label">Hora del fichaje</div>
          <div class="overlay-hora" id="overlay-hora"></div>
          <div class="overlay-fecha" id="overlay-fecha"></div>
        </div>
        <div class="overlay-hint">Toca para cerrar</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
